<section class="hero">
  <div class="hero-glow glow-primary" aria-hidden="true"></div>
  <div class="hero-glow glow-tertiary" aria-hidden="true"></div>
  <div class="hero-grain" aria-hidden="true"></div>

  <div class="hero-content">
    <h1 class="hero-title">
      <span class="line line-1">Tell us your mood.</span>
      <span class="line line-2">We'll find something good.</span>
    </h1>

    <p class="hero-subtitle">
      Search the full catalog, or hand us a few keywords and genres
      and get picks made for you.
    </p>

    <div class="hero-actions">
      <a mat-flat-button color="primary" class="cta-primary" routerLink="/browse">
        Browse Movies
      </a>
      <a mat-stroked-button color="primary" class="cta-secondary" routerLink="/recommendations">
        Get Recommendations
      </a>
    </div>
  </div>
</section>
